spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    show-sql: false

cors:
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:https://zakop.pl}
  allowed-headers: ${CORS_ALLOWED_HEADERS:*}

logging:
  level:
    pl.zakop: INFO
