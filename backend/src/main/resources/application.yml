spring:
  application:
    name: zakop-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

server:
  port: 8080

cors:
  allowed-origin-patterns: http://localhost:[*]
  allowed-headers: "*"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
