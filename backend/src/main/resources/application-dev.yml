spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/zakop}
    username: ${SPRING_DATASOURCE_USERNAME:zakop}
    password: ${SPRING_DATASOURCE_PASSWORD:zakop}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

cors:
  allowed-origin-patterns: http://localhost:[*]
  allowed-headers: "*"

logging:
  level:
    pl.zakop: DEBUG
    org.springframework.web: INFO
