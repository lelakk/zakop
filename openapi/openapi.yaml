openapi: 3.0.3
info:
  title: Zakop API
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
paths:
  /auth/register:
    post:
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /posts:
    get:
      operationId: getPosts
      parameters:
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [HOT, NEW]
            default: HOT
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PostSummaryDto'
    post:
      operationId: createPost
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetailsDto'

  /posts/{postId}:
    get:
      operationId: getPostById
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetailsDto'
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /posts/{postId}/votes:
    put:
      operationId: votePost
      security:
        - BearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteResponse'
    delete:
      operationId: cancelVote
      security:
        - BearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteResponse'

  /posts/{postId}/comments:
    post:
      operationId: addComment
      security:
        - BearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentDto'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AuthRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      required: [token, email]
      properties:
        token:
          type: string
        email:
          type: string

    CreatePostRequest:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
        content:
          type: string
        imageUrl:
          type: string
          nullable: true

    PostSummaryDto:
      type: object
      required: [id, title, content, authorEmail, voteScore, commentsCount, createdAt]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        content:
          type: string
        imageUrl:
          type: string
          nullable: true
        authorEmail:
          type: string
        voteScore:
          type: integer
        userVote:
          type: string
          enum: [UPVOTE, DOWNVOTE, NONE]
          default: NONE
        commentsCount:
          type: integer
        createdAt:
          type: string

    PostDetailsDto:
      allOf:
        - $ref: '#/components/schemas/PostSummaryDto'
        - type: object
          required: [comments]
          properties:
            comments:
              type: array
              items:
                $ref: '#/components/schemas/CommentDto'

    CreateCommentRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
        parentId:
          type: integer
          format: int64
          nullable: true

    CommentDto:
      type: object
      required: [id, authorEmail, content, createdAt, children]
      properties:
        id:
          type: integer
          format: int64
        parentId:
          type: integer
          format: int64
          nullable: true
        authorEmail:
          type: string
        content:
          type: string
        createdAt:
          type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/CommentDto'

    VoteRequest:
      type: object
      required: [voteType]
      properties:
        voteType:
          type: string
          enum: [UPVOTE, DOWNVOTE]

    VoteResponse:
      type: object
      required: [postId, newVoteScore, currentVote]
      properties:
        postId:
          type: integer
          format: int64
        newVoteScore:
          type: integer
        currentVote:
          type: string
          enum: [UPVOTE, DOWNVOTE, NONE]

    ProblemDetail:
      type: object
      required: [status, title]
      properties:
        status:
          type: integer
        title:
          type: string
        detail:
          type: string
